id = "francocalvo.settle"
name = "Settle"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Settle (archive) herdr spaces and restore them with resumed conversations"
platforms = ["macos", "linux"]

[[build]]
command = ["uv", "sync", "--frozen"]

[[actions]]
id = "settle"
title = "Settle current space"
description = "Archive the focused workspace and close it; restore later with resumed conversations."
contexts = ["workspace", "pane"]
command = ["/Users/francocalvo/personal/herdr-settle/.venv/bin/python", "-m", "herdr_settle", "settle"]

[[actions]]
id = "settle-force"
title = "Settle current space (force)"
description = "Archive and close the focused workspace even when agents are still working."
contexts = ["workspace", "pane"]
command = ["/Users/francocalvo/personal/herdr-settle/.venv/bin/python", "-m", "herdr_settle", "settle", "--force"]

[[panes]]
id = "archive"
title = "Settled spaces"
description = "Browse settled spaces; restore or discard them."
placement = "popup"
width = "70%"
height = "50%"
command = ["/Users/francocalvo/personal/herdr-settle/.venv/bin/python", "-m", "herdr_settle", "archive"]
